<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Neguedri Stream reúne canais ao vivo, filmes e séries com perfis e retomada de reprodução.">
  <link rel="icon" href="/neguedri.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/neguedri.png">
  <title>Neguedri Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f1015; color: #fff; display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar leve */
    .sidebar { width: 240px; background: #17181f; border-right: 1px solid #28293d; display: flex; flex-direction: column; }
    
    .sidebar-header { 
      width: 100%;
      height: 120px;
      padding: 0;
      margin: 0;
      border-bottom: 1px solid #28293d; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .sidebar-header img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sidebar-header span { font-size: 20px; font-weight: 800; color: #e50914; padding: 10px; }

    /* Menu Lateral Otimizado */
    .menu { list-style: none; padding: 10px 0; }
    .menu-item { padding: 12px 20px; cursor: pointer; color: #a0a0ab; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .menu-item:hover, .menu-item.active { background: #222436; color: #fff; border-left: 4px solid #e50914; }

    .profile-section { margin-top: auto; padding: 15px; border-top: 1px solid #28293d; }
    .profile-select { width: 100%; padding: 8px; background: #222436; border: 1px solid #333652; color: #fff; border-radius: 4px; cursor: pointer; }

    /* Área Principal */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { height: 60px; background: #17181f; border-bottom: 1px solid #28293d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .search-bar { width: 300px; padding: 8px 12px; background: #222436; border: 1px solid #333652; border-radius: 4px; color: #fff; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #e50914; color: white; }

    .view-area { flex: 1; display: flex; overflow: hidden; }
    .categories-list { width: 260px; background: #13141c; border-right: 1px solid #28293d; overflow-y: auto; }
    .category-item { padding: 12px 15px; border-bottom: 1px solid #1c1d29; cursor: pointer; font-size: 14px; color: #bbb; }
    .category-item:hover, .category-item.active { background: #222436; color: #fff; }
    .category-item.all-category { font-weight: bold; color: #e50914; border-bottom: 2px solid #28293d; }

    .content-grid-wrapper { flex: 1; padding: 20px; overflow-y: auto; }
    .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

    /* Cards Otimizados para TV */
    .card { background: #17181f; border-radius: 6px; overflow: hidden; border: 1px solid #28293d; cursor: pointer; text-align: center; display: flex; flex-direction: column; position: relative; }
    .card:focus, .card:hover { border-color: #e50914; }
    .card img { width: 100%; height: 150px; object-fit: cover; background: #000; }
    .card-title { padding: 8px; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

    .fav-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); border: none; color: #ffca28; font-size: 16px; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; }

    /* Modal de Séries */
    .series-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 998; justify-content: center; align-items: center; }
    .series-modal.active { display: flex; }
    .series-box { background: #17181f; border-radius: 6px; width: 85%; max-width: 800px; height: 75vh; border: 1px solid #28293d; display: flex; flex-direction: column; overflow: hidden; }
    .series-header { padding: 15px; background: #222436; border-bottom: 1px solid #28293d; display: flex; justify-content: space-between; align-items: center; }
    .series-body { flex: 1; display: flex; overflow: hidden; }
    .seasons-list { width: 200px; background: #13141c; border-right: 1px solid #28293d; overflow-y: auto; }
    .season-item { padding: 10px 12px; border-bottom: 1px solid #1c1d29; cursor: pointer; font-size: 13px; color: #bbb; }
    .season-item:hover, .season-item.active { background: #222436; color: #fff; font-weight: bold; }
    
    .episodes-list { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .episode-card { background: #222436; padding: 10px 14px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333652; }
    .episode-card:hover { border-color: #e50914; }
    .episode-info h5 { font-size: 13px; color: #fff; margin-bottom: 2px; }

    /* Player Otimizado */
    .player-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    .player-modal.active { display: flex; }
    .video-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; background: #000; object-fit: contain; }
    .close-player { position: absolute; top: 20px; right: 30px; font-size: 28px; color: #fff; cursor: pointer; z-index: 1001; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 4px; }

    .next-ep-btn {
      display: none;
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: #e50914;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1002;
    }

    /* Modais secundários */
    .modal-form { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
    .modal-form.active { display: flex; }
    .form-box { background: #17181f; padding: 20px; border-radius: 6px; width: 380px; border: 1px solid #28293d; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 3px; font-size: 11px; color: #aaa; }
    .form-group input { width: 100%; padding: 7px; background: #222436; border: 1px solid #333652; color: #fff; border-radius: 4px; }

    :root {
      color-scheme: dark;
      --surface: #17181f;
      --surface-raised: #20212b;
      --surface-soft: #252735;
      --line: #30313f;
      --muted: #a6a8b5;
      --accent: #ef3340;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { min-height: 100%; background: #101116; }
    body { min-height: 100vh; min-height: 100dvh; background: #101116; }
    button, input, select { font: inherit; }
    button, select, .card, .category-item, .season-item, .episode-card { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .sidebar { width: 256px; flex: 0 0 256px; background: #15161d; border-color: #292a35; }
    .sidebar-header { height: 148px; flex: 0 0 148px; padding: 16px; }
    .sidebar-header img { width: 100%; height: 100%; object-fit: contain; border-radius: 18px; }
    .menu { display: flex; flex-direction: column; gap: 7px; padding: 16px 12px; }
    .menu li { list-style: none; }
    .menu-item { width: 100%; min-height: 48px; padding: 11px 14px; gap: 12px; border: 1px solid transparent; border-left: 3px solid transparent; border-radius: 12px; background: transparent; color: #b7b8c2; text-align: left; font-size: 14px; transition: background .18s ease, color .18s ease, border-color .18s ease; }
    .menu-item:hover, .menu-item.active { background: #242630; border-left-color: var(--accent); color: #fff; }
    .menu-icon { width: 23px; flex: 0 0 23px; text-align: center; font-size: 19px; }
    .main-content { min-width: 0; background: #101116; }
    .top-bar { min-height: 76px; height: auto; gap: 18px; padding: 12px 24px; background: #15161d; border-color: #292a35; }
    .topbar-heading { min-width: 150px; }
    #sectionTitle { font-size: 20px !important; letter-spacing: -.3px; }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .profile-select { min-height: 42px; min-width: 130px; max-width: 190px; padding: 8px 34px 8px 12px; border-color: var(--line); border-radius: 10px; }
    .toolbar-actions .btn { min-height: 42px; white-space: nowrap; border-radius: 10px; }
    .search-bar { width: min(30vw, 340px); min-height: 42px; padding: 9px 14px; border-color: var(--line); border-radius: 10px; }
    .view-area { min-height: 0; }
    .categories-list { width: 250px; flex: 0 0 250px; border-color: #292a35; }
    .category-item { min-height: 46px; padding: 13px 16px; border-color: #22232d; font-size: 14px; }
    .content-grid-wrapper { min-width: 0; padding: 24px; }
    .content-grid { grid-template-columns: repeat(auto-fill, minmax(174px, 1fr)); gap: 18px; align-content: start; }
    .card { min-width: 0; border-color: #2b2c37; border-radius: 13px; background: #17181f; text-align: left; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .card:hover, .card:focus-visible { z-index: 1; transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 30px #0007; }
    .card img { height: clamp(170px, 21vw, 280px); background: #0a0b0e; }
    .card-title { padding: 12px 12px 5px; font-size: 14px; line-height: 1.35; }
    .card-subtitle { padding: 0 12px 11px; color: var(--muted); font-size: 12px; }
    .fav-btn { width: 38px; height: 38px; top: 9px; right: 9px; font-size: 21px; background: #090a0dc9; }
    .progress-track { height: 4px; margin: 0 12px 12px; overflow: hidden; border-radius: 99px; background: #484954; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .about-panel { display: none; width: min(900px, 100%); margin: 0 auto; }
    .about-panel.visible { display: block; }
    .about-hero { padding: clamp(22px, 5vw, 42px); border: 1px solid #2b2c37; border-radius: 22px; background: radial-gradient(ellipse at top right, #a7192b55, transparent 48%), linear-gradient(145deg, #1b1c25, #13141a); }
    .about-kicker { margin-bottom: 12px; color: #ff7a83; font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
    .about-hero h2 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 40px); }
    .about-hero p { max-width: 650px; color: #c2c3cc; line-height: 1.65; }
    .about-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 16px; }
    .about-detail { padding: 19px; border: 1px solid #2b2c37; border-radius: 16px; background: #17181f; }
    .about-detail h3 { margin-bottom: 9px; font-size: 14px; }
    .about-detail p, .about-detail li { color: #b5b6c0; font-size: 13px; line-height: 1.6; }
    .about-detail ul { padding-left: 18px; }
    .about-contact { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 12px; padding: 10px 15px; border-radius: 10px; background: #198754; color: #fff; font-weight: 700; text-decoration: none; }
    .about-contact:hover { background: #20a466; }
    .series-box { width: min(920px, calc(100% - 36px)); height: min(78vh, 760px); height: min(78dvh, 760px); border-radius: 18px; }
    .series-header { min-height: 62px; padding: 14px 18px; }
    .series-body { min-height: 0; }
    .seasons-list { width: 220px; flex: 0 0 220px; }
    .season-item { min-height: 44px; padding: 12px 16px; border: 0; border-bottom: 1px solid #1c1d29; background: transparent; text-align: left; }
    .episodes-list { gap: 10px; padding: 16px; }
    .episode-card { min-height: 64px; padding: 12px 14px; border-radius: 12px; color: #fff; text-align: left; }
    .episode-card:focus-within, .episode-card:hover { border-color: var(--accent); }
    .episode-info h5 { font-size: 14px; }
    .episode-card button { min-width: 44px; min-height: 44px; border-radius: 10px; }
    .player-modal { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
    .video-container { min-height: 0; }
    video { max-height: 100dvh; object-fit: contain; }
    .close-player { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); min-height: 44px; padding: 9px 14px; border: 0; border-radius: 10px; background: #14151bcc; font: inherit; }
    .next-ep-btn { right: max(20px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); min-height: 48px; border-radius: 12px; }
    .form-box { width: min(420px, calc(100vw - 28px)); padding: 22px; border-radius: 18px; }
    .form-group input { min-height: 44px; border-radius: 9px; }
    .btn { min-height: 42px; border-radius: 9px; }

    @media (min-width: 1450px) {
      .sidebar { width: 286px; flex-basis: 286px; }
      .categories-list { width: 285px; flex-basis: 285px; }
      .content-grid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 22px; }
