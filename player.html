
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Neguedri Stream</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .player-shell {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .top-bar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) 20px 18px;
      background: linear-gradient(#000d, transparent);
      pointer-events: none;
    }

    .title {
      max-width: calc(100% - 110px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 1px 5px #000;
    }

    button {
      pointer-events: auto;
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      color: #fff;
      background: #e50914;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
    }

    button:active {
      transform: scale(.97);
    }

    .next-button {
      display: none;
      position: absolute;
      right: 20px;
      bottom: max(30px, env(safe-area-inset-bottom));
      z-index: 6;
    }

    .status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 30px;
      color: #ddd;
      text-align: center;
      pointer-events: none;
      line-height: 1.6;
      font-size: 15px;
    }

    .status.error {
      color: #ff8a8a;
    }

    @media (max-width: 600px) {
      .top-bar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .title {
        font-size: 14px;
      }

      button {
        padding: 9px 12px;
        font-size: 12px;
      }

      .next-button {
        right: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="player-shell">

    <video
      id="externalVideo"
      controls
      autoplay
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>

    <div class="top-bar">
      <div id="playerTitle" class="title">
        Preparando reprodução...
      </div>

      <button type="button" onclick="fecharJanela()">
        ✕ Fechar
      </button>
    </div>

    <button id="nextButton" class="next-button" type="button"
      onclick="pedirProximo()">
      Próximo episódio ⏭️
    </button>

    <div id="status" class="status">
      Aguardando o vídeo...
    </div>

  </main>

  <script>
    let hls = null;
    let playbackAtual = null;
    let tentativaAtual = 0;
    let tentativasRedeHls = 0;
    let tentativasMidiaHls = 0;

    const video = document.getElementById('externalVideo');
    const title = document.getElementById('playerTitle');
    const status = document.getElementById('status');
    const nextButton = document.getElementById('nextButton');

    function mostrarStatus(mensagem, erro = false) {
      status.textContent = mensagem;
      status.classList.toggle('error', erro);
      status.style.display = 'grid';
    }

    function ocultarStatus() {
      status.style.display = 'none';
    }

    function avisarPai(message) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, window.location.origin);
      }
    }

    function limparPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    function ehUrlHls(url) {
      try {
        const parsed = new URL(url, window.location.href);
        const original = parsed.searchParams.get('url');

        if (original) {
          return new URL(original).pathname.toLowerCase().endsWith('.m3u8');
        }

        return parsed.pathname.toLowerCase().endsWith('.m3u8');
      } catch (e) {
        return /\.m3u8(?:$|[?#])/i.test(String(url || ''));
      }
    }

    function tentarTelaCheia() {
      const elemento = document.documentElement;

      if (document.fullscreenElement || !elemento.requestFullscreen) {
        return;
      }

      elemento.requestFullscreen().catch(() => {});
    }

    async function iniciarVideo() {
      try {
        await video.play();
        ocultarStatus();
      } catch (error) {
        mostrarStatus('Toque no botão de reprodução para iniciar o vídeo.');
      }
    }

    function reproduzir(playback) {
      if (!playback || !playback.url) {
        mostrarStatus('Endereço de vídeo inválido.', true);
        return;
      }

      playbackAtual = playback;
      tentativaAtual++;
      tentativasRedeHls = 0;
      tentativasMidiaHls = 0;

      document.title = playback.titulo || 'Neguedri Stream';
      title.textContent = playback.titulo || 'Neguedri Stream';

      mostrarStatus('Conectando ao servidor...');
      nextButton.style.display = 'none';

      limparPlayer();

      video.ontimeupdate = () => {
        if (
          playback.podeTerProximo &&
          Number.isFinite(video.duration) &&
          video.duration > 0 &&
          video.duration - video.currentTime <= 25
        ) {
          nextButton.style.display = 'block';
        } else {
          nextButton.style.display = 'none';
        }
      };

      video.onended = () => {
        if (playback.podeTerProximo) pedirProximo();
      };

      video.onplaying = ocultarStatus;

      video.onerror = () => {
        const erro = video.error;
        let mensagem = 'Não foi possível reproduzir o vídeo.';

        if (erro) {
          if (erro.code === 2) {
            mensagem = 'Erro de rede ao carregar o vídeo.';
          } else if (erro.code === 3) {
            mensagem = 'Erro ao decodificar o vídeo. O codec pode não ser compatível.';
          } else if (erro.code === 4) {
            mensagem = 'Formato ou endereço de vídeo não reconhecido pelo navegador.';
          }
        }

        mostrarStatus(mensagem, true);
      };

      const url = playback.url;

      if (ehUrlHls(url)) {
        const hlsNativo = video.canPlayType('application/vnd.apple.mpegurl');

        if (hlsNativo) {
          video.src = url;
          video.load();

          video.addEventListener('loadedmetadata', iniciarVideo, { once: true });

        } else if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            backBufferLength: 30,
            manifestLoadingTimeOut: 20000,
            manifestLoadingMaxRetry: 3,
            levelLoadingMaxRetry: 3,
            fragLoadingMaxRetry: 4
          });

          hls.attachMedia(video);

          hls.on(Hls.Events.MEDIA_ATTACHED, () => {
            hls.loadSource(url);
          });

          hls.on(Hls.Events.MANIFEST_PARSED, iniciarVideo);

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;

            console.error('Erro HLS:', data);

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && tentativasRedeHls < 3) {
              tentativasRedeHls++;
              mostrarStatus(`Falha de conexão. Nova tentativa ${tentativasRedeHls}/3...`);
              hls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && tentativasMidiaHls < 2) {
              tentativasMidiaHls++;
              mostrarStatus('Recuperando a reprodução...');
              hls.recoverMediaError();
            } else {
              mostrarStatus('Não foi possível reproduzir esta transmissão. Verifique a conexão ou tente outro canal.', true);
              hls.destroy();
              hls = null;
            }
          });

        } else {
          mostrarStatus(
            'Este navegador não possui suporte à reprodução HLS.',
            true
          );
        }

      } else {
        video.src = url;
        video.load();

        video.addEventListener('loadedmetadata', iniciarVideo, { once: true });
      }

      video.addEventListener('click', tentarTelaCheia, { once: true });
    }

    function pedirProximo() {
      avisarPai({ type: 'iptv-player-next' });
    }

    function fecharJanela() {
      avisarPai({ type: 'iptv-player-closed' });
      limparPlayer();
      window.close();
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      if (event.source !== window.opener) return;

      if (event.data && event.data.type === 'iptv-player-load') {
        reproduzir(event.data.playback);
      }
    });

    window.addEventListener('beforeunload', () => {
      avisarPai({ type: 'iptv-player-closed' });
      limparPlayer();
    });

    document.addEventListener('pointerdown', tentarTelaCheia, { once: true });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    });

    avisarPai({ type: 'iptv-player-ready' });
  </script>
</body>
</html>
