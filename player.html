<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neguedri Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .player-shell { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .top-bar { position: absolute; inset: 0 0 auto 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; background: linear-gradient(#000b, transparent); pointer-events: none; }
    .title { max-width: calc(100% - 120px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 700; text-shadow: 0 1px 4px #000; }
    button { pointer-events: auto; border: 0; border-radius: 4px; padding: 8px 12px; color: #fff; background: #e50914; font-weight: 700; cursor: pointer; }
    .next-button { display: none; position: absolute; right: 24px; bottom: 72px; z-index: 3; }
    .status { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; color: #bbb; text-align: center; pointer-events: none; }
    .status.error { color: #ff8a8a; }
  </style>
</head>
<body>
  <main class="player-shell">
    <video id="externalVideo" controls autoplay playsinline></video>
    <div class="top-bar">
      <div id="playerTitle" class="title">Preparando reprodução...</div>
      <button type="button" onclick="fecharJanela()">✕ Fechar</button>
    </div>
    <button id="nextButton" class="next-button" type="button" onclick="pedirProximo()">Próximo episódio ⏭️</button>
    <div id="status" class="status">Aguardando o vídeo...</div>
  </main>

  <script>
    let hls = null;
    let playbackAtual = null;

    const video = document.getElementById('externalVideo');
    const title = document.getElementById('playerTitle');
    const status = document.getElementById('status');
    const nextButton = document.getElementById('nextButton');

    function avisarPai(message) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, window.location.origin);
      }
    }

    function limparPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    function ehUrlHls(url) {
      try {
        return new URL(url, window.location.href).pathname.toLowerCase().endsWith('.m3u8');
      } catch (e) {
        return String(url || '').toLowerCase().includes('.m3u8');
      }
    }

    function tentarTelaCheia() {
      const elemento = document.documentElement;
      if (document.fullscreenElement || !elemento.requestFullscreen) return;
      elemento.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    }

    function reproduzir(playback) {
      if (!playback || !playback.url) return;

      playbackAtual = playback;
      document.title = playback.titulo || 'Neguedri Stream';
      title.textContent = playback.titulo || 'Neguedri Stream';
      status.textContent = 'Carregando vídeo...';
      status.classList.remove('error');
      nextButton.style.display = 'none';
      limparPlayer();

      video.ontimeupdate = () => {
        if (playback.podeTerProximo && video.duration && video.duration - video.currentTime <= 25) {
          nextButton.style.display = 'block';
        } else {
          nextButton.style.display = 'none';
        }
      };

      video.onended = () => {
        if (playback.podeTerProximo) pedirProximo();
      };

      video.onerror = () => {
        status.textContent = 'Não foi possível reproduzir este vídeo.';
        status.classList.add('error');
      };

      const iniciar = () => {
        status.textContent = '';
        video.play().catch(() => {
          status.textContent = 'Clique no vídeo para iniciar a reprodução.';
        });
      };

      if (ehUrlHls(playback.url) && window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, liveSyncDurationCount: 3 });
        hls.loadSource(playback.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, iniciar);
      } else {
        video.src = playback.url;
        video.addEventListener('loadedmetadata', iniciar, { once: true });
        video.addEventListener('canplay', iniciar, { once: true });
      }

      tentarTelaCheia();
    }

    function pedirProximo() {
      avisarPai({ type: 'iptv-player-next' });
    }

    function fecharJanela() {
      avisarPai({ type: 'iptv-player-closed' });
      window.close();
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || event.source !== window.opener) return;
      if (event.data && event.data.type === 'iptv-player-load') reproduzir(event.data.playback);
    });

    window.addEventListener('beforeunload', () => avisarPai({ type: 'iptv-player-closed' }));
    document.addEventListener('pointerdown', tentarTelaCheia, { once: true });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    });

    avisarPai({ type: 'iptv-player-ready' });
  </script>
</body>
</html>
